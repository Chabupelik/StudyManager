name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  lint-python:
    name: "Python - ruff + mypy"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter tools
        run: pip install ruff mypy

      - name: ruff check & format
        run: |
          ruff check .
          ruff format --check .

      - name: mypy check
        run: mypy app tgbot --ignore-missing-imports

  build-and-deploy:
    name: "Build Frontend & Deploy"
    runs-on: ubuntu-latest
    needs: [lint-python]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc --noEmit
          npm run build

      - name: Deploy everything via single SSH session
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/StudyManager
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose exec -T backend alembic upgrade head
            docker image prune -f

      - name: Sync Frontend Dist (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          REMOTE_PORT: ${{ vars.SERVER_PORT || 22 }}
          SOURCE: "frontend/dist/"
          TARGET: "StudyManager/frontend/dist"
          ARGS: "-rlgoDzvc --delete"

  notify:
    name: "Telegram notification"
    runs-on: ubuntu-latest
    needs: [lint-python, build-and-deploy]
    if: always()
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          LINT_STATUS: ${{ needs.lint-python.result }}
          DEPLOY_STATUS: ${{ needs.build-and-deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_STATUS" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Задеплоено успешно"
          elif [ "$LINT_STATUS" = "failure" ]; then
            ICON="❌"
            STATUS_TEXT="Упал линтер / mypy"
          else
            ICON="❌"
            STATUS_TEXT="Деплой / билд упал"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          esc() { echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          MSG="${ICON} <b>$(esc "$STATUS_TEXT")</b>

          📦 <b>Коммит:</b> <code>${SHORT_SHA}</code>
          💬 $(esc "$COMMIT_MSG")
          👤 $(esc "$ACTOR")
          🔗 <a href=\"${RUN_URL}\">Открыть в Actions</a>"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true"