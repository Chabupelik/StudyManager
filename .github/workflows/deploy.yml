name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  lint-python:
    name: "Python - ruff + mypy"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dev-deps
        run: pip install ruff mypy -r requirements.txt

      - name: ruff - lint check
        run: ruff check .

      - name: ruff - format check (no auto-fix)
        run: ruff format --check .

      - name: mypy - static type check
        run: mypy app tgbot --ignore-missing-imports

  build-frontend:
    name: "Frontend - tsc + vite build"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: "Deploy to VPS"
    runs-on: ubuntu-latest
    needs: [lint-python, build-frontend]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Copy dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          source: "frontend/dist/"
          target: "~/StudyManager/"

      - name: SSH - pull and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SERVER_PORT }}
          script: |
            set -e
            cd ~/StudyManager
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build

  notify:
    name: "Telegram notification"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TG_NOTIFY_CHAT_ID }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_STATUS" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="Задеплоено успешно"
          else
            ICON="❌"
            STATUS_TEXT="Деплой упал"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"

          escape() {
            python3 -c "
import sys, re
text = sys.argv[1]
escaped = re.sub(r'([_*\[\]()~\`>#+\-=|{}.!])', r'\\\1', text)
print(escaped)
" "$1"
          }

          MSG="${ICON} *$(escape "$STATUS_TEXT")*

          📦 *Коммит:* \`${SHORT_SHA}\`
          💬 $(escape "$COMMIT_MSG")
          👤 $(escape "$ACTOR")
          🔗 [Открыть в Actions](${RUN_URL})"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview="true"

