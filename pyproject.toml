[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

ignore = [
    "E501",    # Игнорировать длину строк (Line too long)
    "E741",    # Разрешить короткие имена переменных (l, I)
    "B008",    # FastAPI Depends()
    "LOG015",  # Логгер root
    "UP046",   # Generic классы
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tgbot"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = [
    "import-untyped",
    "union-attr",
    "arg-type",
    "prop-decorator",
    "var-annotated",
    "misc",
    "operator",
    "assignment",
    "return-value",
    "dict-item",
    "index",
    "attr-defined",
    "call-overload",
    "type-var",
]

[[tool.mypy.overrides]]
module = ["tgbot.*", "migrations.*"]
ignore_errors = true
